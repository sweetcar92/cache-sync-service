name: Data Sync Pipeline

on:
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-build]

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends calibre
          if [ ! -f /usr/local/bin/kepubify ]; then
            sudo wget -q https://github.com/pgaskin/kepubify/releases/latest/download/kepubify-linux-64bit -O /usr/local/bin/kepubify
            sudo chmod +x /usr/local/bin/kepubify
          fi

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib requests curl_cffi Pillow html5_parser

      - name: Generate Datasets
        env:
          TZ: "Europe/Paris"
          ZENROWS_KEY: ${{ secrets.ZENROWS_KEY }}
          SCRAPEOPS_KEY: ${{ secrets.SCRAPEOPS_KEY }}
          SCRAPEOPS_KEY_BACKUP: ${{ secrets.SCRAPEOPS_KEY_BACKUP }}
        run: |
          DATE_FILE=$(date +'%Y-%m-%d_%Hh%M')
          echo "DATE_FILE=$DATE_FILE" >> $GITHUB_ENV
          python build_epubs.py "$DATE_FILE"

      - name: Convert Outputs
        run: |
          kepubify *.epub
          for f in *_converted.kepub.epub; do
            [ -f "$f" ] && mv "$f" "${f/_converted.kepub.epub/.kepub.epub}"
          done
          for f in *.kepub.epub; do
            [ -f "$f" ] || continue
            python set_epub_metadata.py "$f"
          done
          echo "=== Datasets Ready ==="
          ls -lh *.kepub.epub

      - name: Sync Outputs to External Storage
        env:
          GDRIVE_FOLDER_ID: "1fonLAb_c2_2ax6EAIpvZnNlrHGK_cqsY"
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          python drive_sync.py
